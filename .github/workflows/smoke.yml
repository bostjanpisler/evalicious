name: Smoke test

# Checks the live site. A failed scheduled run emails the repository owner, so this is
# the "is the site broken?" alarm: every 30 minutes for the critical pages, daily for
# every URL in the sitemap (this is what finds one broken page among hundreds).
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Check every URL in the sitemap"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Smoke test
        run: |
          if [ "${{ github.event.schedule }}" = "17 3 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            bun scripts/smoke.ts --full
          else
            bun scripts/smoke.ts
          fi
